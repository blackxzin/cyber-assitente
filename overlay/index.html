<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cyber — Desktop Overlay</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    #stage {
      width: 100%; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #char {
      width: 100%; height: 100%;
      image-rendering: pixelated;
      transition: filter 0.3s;
      object-fit: contain;
    }
    .flip { transform: scaleX(-1); }

    /* --- Menu contextual cyberpunk --- */
    .cyber-menu {
      position: absolute;
      top: 0; left: 0;
      z-index: 10;
      background: rgba(10, 12, 24, 0.92);
      border: 1px solid #22d3ee;
      border-radius: 8px;
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
      padding: 6px 0;
      min-width: 170px;
      font-family: "Fira Code", monospace;
    }
    .cyber-menu .menu-title {
      font-size: 11px;
      letter-spacing: 3px;
      color: #22d3ee;
      text-align: center;
      padding: 4px 10px 6px;
      border-bottom: 1px solid rgba(34, 211, 238, 0.3);
      margin-bottom: 4px;
    }
    .cyber-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: #e2e8f0;
      font: 12px/1.4 "Fira Code", monospace;
      padding: 6px 14px;
      cursor: pointer;
    }
    .cyber-menu button:hover {
      background: rgba(34, 211, 238, 0.18);
      color: #22d3ee;
    }

    /* --- Toast --- */
    .cyber-toast {
      position: absolute;
      bottom: 8px; left: 8px;
      z-index: 11;
      max-width: 260px;
      background: rgba(10, 12, 24, 0.9);
      border: 1px solid #a78bfa;
      border-radius: 6px;
      color: #e2e8f0;
      font: 11px/1.5 "Fira Code", monospace;
      padding: 8px 10px;
      white-space: pre-line;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
    }
    .cyber-toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="stage"><img id="char" alt="Cyber" /></div>

  <!-- Menu contextual (abre no clique na personagem) -->
  <div id="menu" class="cyber-menu" hidden>
    <div class="menu-title">CYBER</div>
    <button data-action="chat">💬 Chat de texto</button>
    <button data-action="voice">🎙 Falar com ela</button>
    <button data-action="look">👁 Olhar a tela</button>
    <button data-action="status">📊 Status do sistema</button>
    <button data-action="ground">⬇ Voltar ao chão</button>
    <button data-action="close">✖ Fechar</button>
  </div>

  <!-- Toast rápido (status, erros) -->
  <div id="toast" class="cyber-toast"></div>
  <script>
    // estado global: recebido via preload
    window.__cfg = { spriteDir: "", scale: 100, states: {} };
    window.__state = "idle";
    window.__dir = 1;
    let frame = 1;
    let lastTick = 0;
    const img = document.getElementById("char");

    const pad2 = (n) => String(n).padStart(2, "0");

    function setFrame() {
      const s = window.__cfg.states[window.__state];
      if (!s) return;
      img.src = `${window.__cfg.spriteDir}/${s.dir}/${s.dir}_${pad2(frame)}.png`;
      frame = frame >= s.frames ? 1 : frame + 1;
      img.className = window.__dir < 0 ? "flip" : "";
      img.onerror = () => console.error("FALHA ao carregar sprite:", img.src);
    }

    // tick de animação baseado no FPS do estado atual
    setInterval(() => {
      const s = window.__cfg.states[window.__state];
      if (!s) return;
      const now = Date.now();
      if (now - lastTick >= 1000 / s.fps) {
        lastTick = now;
        setFrame();
      }
    }, 16);

    // config vindo do main
    window.overlay.onConfig((cfg) => {
      console.log("onConfig recebido", cfg.spriteDir, cfg.width + "x" + cfg.height);
      window.__cfg = cfg;
      // largura/altura já são 100% via CSS; nada a ajustar aqui
      setFrame();
    });

    // frame tick vindo do main (estado + direção)
    window.overlay.onFrame((data) => {
      window.__state = data.state;
      window.__dir = data.direction;
    });

    // (atalho removido) a personagem caminha sempre; estados de voz sobrepõem

    // --- Interação: clique (menu) vs arrastar (mover) ---
    let pressX = 0, pressY = 0, moved = false;
    const menuEl = document.getElementById("menu");
    const toastEl = document.getElementById("toast");

    img.addEventListener("pointerdown", (e) => {
      moved = false;
      pressX = e.screenX; pressY = e.screenY;
      window.overlay.dragStart(e.screenX, e.screenY);
    });
    window.addEventListener("pointermove", (e) => {
      if (Math.abs(e.screenX - pressX) > 4 || Math.abs(e.screenY - pressY) > 4) moved = true;
    });
    function setMenu(open) {
      menuEl.hidden = !open;
      window.overlay.menuSetOpen(open);
    }

    window.addEventListener("pointerup", (e) => {
      window.overlay.dragEnd();
      if (moved) return; // foi arrasto, não clique
      // clique curto: alterna o menu
      setMenu(menuEl.hidden);
    });

    // ações do menu
    document.querySelectorAll("#menu button").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        const action = btn.dataset.action;
        setMenu(false);
        window.overlay.menuAction(action);
      });
    });

    // toast (status etc. vindo do main)
    window.overlay.onToast((msg) => {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(() => toastEl.classList.remove("show"), 4000);
    });
  </script>
</body>
</html>
