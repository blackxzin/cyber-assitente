name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest
      - name: Check test coverage (min 80%)
        run: pytest --cov=backend --cov-report=term-missing --cov-fail-under=80
      - name: Run safety self-check
        run: python tests/test_safety.py
      - name: Bandit static security scan
        run: bandit -r backend -ll -q
